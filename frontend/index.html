<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#cc0000" />
  <title>PokeMe 动物图鉴</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar">
  <a class="logo" href="/">Poke<span>Me</span></a>
  <nav>
    <a href="/">扫描</a>
    <a href="/collection">图鉴</a>
    <a href="/chat">聊天</a>
  </nav>
</nav>

<!-- 扫描主页 -->
<main class="scan-page">

  <!-- 摄像头 -->
  <div class="camera-wrapper">
    <video id="camera-video" autoplay playsinline muted></video>
    <div class="scan-overlay">
      <div class="scan-frame"></div>
    </div>
  </div>

  <!-- 快门 -->
  <button class="shutter-btn" id="shutter-btn" aria-label="拍照识别"></button>

  <!-- 上传备用 -->
  <p class="upload-hint">
    没有摄像头？
    <label for="file-input">上传图片</label>
    <input type="file" id="file-input" accept="image/*" style="display:none" />
  </p>

</main>

<!-- Loading 遮罩 -->
<div class="loading-overlay" id="loading-overlay">
  <div class="pokeball-spin">⚙️</div>
  <div class="loading-text">正在识别动物...</div>
</div>

<!-- 图鉴卡片遮罩 -->
<div class="card-overlay" id="card-overlay">
  <div class="pokedex-card" id="pokedex-card">

    <!-- 语音播报按钮 -->
    <button class="narration-btn" id="narration-btn" title="语音播报">🔊</button>

    <!-- 首次发现横幅 -->
    <div class="new-discovery-banner" id="new-discovery-banner">
      ✨ 新动物发现！
    </div>

    <!-- 卡片头部 -->
    <div class="card-header">
      <img class="card-photo" id="card-photo" src="" alt="" />
      <div class="card-title">
        <div class="card-number" id="card-number">#0000</div>
        <div class="card-name"  id="card-name">—</div>
        <div class="card-scientific" id="card-scientific"></div>
        <span class="rarity-badge" id="rarity-badge">普通</span>
      </div>
    </div>

    <hr class="card-divider" />

    <!-- 属性数据 -->
    <div class="card-stats">
      <div class="stat-item">
        <div class="stat-label">体型</div>
        <div class="stat-value" id="stat-height">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">体重</div>
        <div class="stat-value" id="stat-weight">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">栖息地</div>
        <div class="stat-value" id="stat-habitat">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">食性</div>
        <div class="stat-value" id="stat-diet">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">天敌</div>
        <div class="stat-value" id="stat-predator">—</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">保护状态</div>
        <div class="stat-value" id="stat-conservation">—</div>
      </div>
    </div>

    <hr class="card-divider" />

    <!-- 图鉴描述 -->
    <div class="card-description" id="card-description"></div>

    <!-- 属性标签 -->
    <div class="attributes" id="card-attributes"></div>

    <!-- 关闭按钮 -->
    <button class="close-btn" id="close-card-btn">继续扫描</button>

  </div>
</div>

<script src="/static/js/narration.js"></script>
<script src="/static/js/camera.js"></script>
<script src="/static/js/scanner.js"></script>
</body>
</html>
